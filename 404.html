<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
<title>MARFO. Not found</title>
<meta name="robots" content="noindex"/>
<meta name="theme-color" content="#008080"/>
<link rel="icon" id="icon" href="logo.svg" type="image/svg+xml"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Arimo:wght@400;700&amp;family=Silkscreen&amp;display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  color-scheme:light;
  --desk:#008080;
  --face:#c0c0c0;
  --light:#ffffff;
  --soft:#dfdfdf;
  --shadow:#808080;
  --dark:#000000;
  --navy:#000080;
  --navy2:#1084d0;
  --ui:'Arimo',Tahoma,'MS Sans Serif',Arial,sans-serif;
  --px:'Silkscreen',var(--ui);
}
html{height:100%}
body{
  min-height:100%;
  background:var(--desk);
  font:12px/1.3 var(--ui);
  color:#000;
  display:flex;align-items:center;justify-content:center;
  padding:16px;
}
.win{
  width:100%;max-width:360px;
  background:var(--face);
  border:1px solid;border-color:var(--soft) var(--dark) var(--dark) var(--soft);
  box-shadow:inset 1px 1px 0 var(--light),inset -1px -1px 0 var(--shadow),2px 2px 0 rgba(0,0,0,.35);
  padding:3px;
}
.titlebar{
  display:flex;align-items:center;justify-content:space-between;
  background:linear-gradient(90deg,var(--navy),var(--navy2));
  color:#fff;font-weight:700;font-size:11px;
  padding:3px 3px 3px 6px;height:20px;
}
.titlebar .x{
  width:16px;height:14px;
  background:var(--face);color:#000;text-decoration:none;
  border:1px solid;border-color:var(--light) var(--dark) var(--dark) var(--light);
  box-shadow:inset -1px -1px 0 var(--shadow);
  font:700 10px/12px var(--ui);
  display:flex;align-items:center;justify-content:center;
}
.body{display:flex;gap:12px;padding:14px 12px 10px;align-items:flex-start}
.body svg{width:32px;height:32px;flex:none;shape-rendering:crispEdges}
.body h1{font-family:var(--px);font-size:13px;letter-spacing:1px;margin-bottom:6px}
.body p{margin-bottom:4px}
.body code{font:11px/1.3 'Courier New',monospace;word-break:break-all}
.foot{display:flex;justify-content:flex-end;gap:6px;padding:0 8px 8px}
.btn{
  min-width:72px;padding:3px 10px;
  background:var(--face);color:#000;text-decoration:none;text-align:center;font-size:11px;
  border:1px solid;border-color:var(--light) var(--dark) var(--dark) var(--light);
  box-shadow:inset -1px -1px 0 var(--shadow),inset 1px 1px 0 var(--soft);
}
.btn.default{outline:1px solid #000;font-weight:700}
.btn:active{border-color:var(--dark) var(--light) var(--light) var(--dark);box-shadow:inset 1px 1px 0 var(--shadow)}
</style>
</head>
<body>
<div class="win" role="alertdialog" aria-labelledby="t">
  <div class="titlebar"><span id="t">MARFO</span><a class="x" href="./" aria-label="Close">×</a></div>
  <div class="body">
    <svg viewBox="0 0 32 32" aria-hidden="true">
      <circle cx="16" cy="16" r="15" fill="#ff0000" stroke="#000" stroke-width="1"/>
      <path d="M9 9 L23 23 M23 9 L9 23" stroke="#fff" stroke-width="4"/>
    </svg>
    <div>
      <h1>404</h1>
      <p>This page does not exist. <code id="path"></code></p>
      <p>The tool may have moved. Start from the desktop.</p>
      <p lang="tr">Bu sayfa yok. Masaüstüne dönüp oradan başla.</p>
    </div>
  </div>
  <div class="foot"><a class="btn default" href="./" id="home">OK</a></div>
</div>
<script>
(function(){
  document.getElementById('path').textContent=location.pathname;
  /* Pages serves this from the site root, so climb back to it from any depth */
  var base=location.pathname.replace(/\/marfo\/.*$/,'/marfo/');
  if(base.indexOf('/marfo/')<0)base='/';
  document.getElementById('home').href=base;
  document.querySelector('.x').href=base;
  document.getElementById('icon').href=base+'logo.svg';
})();
</script>
</body>
</html>
